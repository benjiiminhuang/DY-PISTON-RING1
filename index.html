<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DY PISTON RING | Engineering Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .oswald {
            font-family: 'Oswald', sans-serif;
        }
        
        /* Social Notification Animation */
        @keyframes socialPop {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            10% { opacity: 1; transform: translateY(0) scale(1); }
            90% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-10px) scale(0.95); }
        }
        .animate-social-pop {
            animation: socialPop 4s ease-in-out infinite;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating Random Appearance Animation */
        @keyframes floatFade {
            0%, 100% { opacity: 0; transform: translateY(10px) scale(0.9); }
            30%, 70% { opacity: 0.8; transform: translateY(0px) scale(1); }
        }
        .animate-float-fade {
            animation: floatFade 6s ease-in-out infinite;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#003366',
                        highlight: '#477dc7',
                        treadmillBlue: '#0056a7'
                    }
                }
            }
        }
    </script>
